# Publishes site/ (with the logo) to GitHub Pages, served at erablesimu.github.io/erable.
name: Site

on:
  push:
    branches: [ccr-88d1adf7-3obcpe]
    paths:
      - 'site/**'
      - 'dist/erable.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp dist/erable.png _site/erable.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
