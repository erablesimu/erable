# Publishes site/ (with the logo and bugs.sqlite, the repository's issues for the bug list) to
# GitHub Pages, served at erablesimu.github.io/erable. Issue changes publish it again.
name: Site

on:
  push:
    branches: [ccr-88d1adf7-3obcpe]
    paths:
      - 'site/**'
      - 'dist/erable.png'
      - '.github/workflows/pages.yml'
      - 'tools/site/export_bugs.py'
      - 'tools/site/stamp_assets.py'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp dist/erable.png _site/erable.png
      - name: Export the issues for the bug list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/site/export_bugs.py _site/bugs.sqlite
      - name: Version the scripts and stylesheets
        run: python3 tools/site/stamp_assets.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
