<html lang="en">
<head>

<meta name="description" content="Erable, a Nintendo Switch 2 emulator.">
<meta name="theme-color" content="#d2501f">
<link rel="icon" href="erable.png">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="./"><img src="erable.png" alt="">Erable</a>
    <nav aria-label="Navigation">
      <a href="./" aria-current="page" data-i18n="nav.home">Accueil</a>
      <a href="guides.html" data-i18n="nav.tutorials">Tutoriels</a>
      <a href="changelog.html" data-i18n="nav.changes">Changements</a>
      <a href="bugs.html" data-i18n="nav.bugs">Bugs</a>
      <a href="report.html" data-i18n="nav.report">Signaler</a>
    </nav>
    <a class="btn small head-cta" href="https://github.com/erablesimu/erable/releases/latest" data-i18n="nav.download">Télécharger</a>
    <div class="lang" role="group" data-i18n-attr="aria-label:nav.language">
      <button type="button" data-set-lang="fr" lang="fr" title="Français">FR</button>
      <button type="button" data-set-lang="en" lang="en" title="English">EN</button>
      <button type="button" data-set-lang="de" lang="de" title="Deutsch">DE</button>
    </div>
  </div>
</header>

<main class="direct">
  <section class="wrap d-hero">
    <div class="d-hero-text">
      <p class="mono-label" data-i18n="home.kicker"></p>
      <h1 data-i18n-html="home.h1"></h1>
      <p class="lead" data-i18n="home.lead"></p>
      <div class="actions">
        <a class="btn big" id="download" href="https://github.com/erablesimu/erable/releases/latest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span data-i18n="home.download"></span><small id="download-meta"></small></a>
        <a class="btn secondary" href="guides/install.html"><span data-i18n="home.install"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
      </div>
      <p class="hero-note" data-i18n="home.note"></p>
    </div>
    <aside class="d-panel" aria-live="polite">
      <div class="d-panel-head"><span class="mono-label" data-i18n="home.panelLabel"></span><span class="live" aria-hidden="true"></span></div>
      <a class="d-tag" id="stat-tag" href="changelog.html">…</a>
      <p class="d-when" id="stat-when"></p>
      <dl class="d-stats">
        <div><dt data-i18n="home.statDownloads"></dt><dd id="stat-downloads">–</dd></div>
        <div><dt data-i18n="home.statTotal"></dt><dd id="stat-total">–</dd></div>
        <div><dt data-i18n="home.statSize"></dt><dd id="stat-size">–</dd></div>
      </dl>
      <p class="mono-label d-notes-label" data-i18n="home.panelNotes"></p>
      <ul class="d-notes" id="stat-notes"><li class="status" data-i18n="home.latestLoading"></li></ul>
    </aside>
  </section>

  <section class="wrap d-section">
    <div class="d-head"><h2 data-i18n="home.releasesTitle"></h2><a class="more" href="changelog.html"><span data-i18n="home.releasesAll"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></div>
    <div class="d-rows" id="release-rows"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="wrap d-section">
    <div class="d-head"><h2 data-i18n="home.guidesTitle"></h2><a class="more" href="guides.html"><span data-i18n="home.guidesAll"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></div>
    <div class="d-rows" id="guide-rows"></div>
  </section>

  <section class="wrap d-section">
    <div class="d-facts">
      <div><p class="mono-label" data-i18n="home.fact1k"></p><p data-i18n="home.fact1"></p></div>
      <div><p class="mono-label" data-i18n="home.fact2k"></p><p data-i18n="home.fact2"></p></div>
      <div><p class="mono-label" data-i18n="home.fact3k"></p><p data-i18n="home.fact3"></p></div>
      <div><p class="mono-label" data-i18n="home.fact4k"></p><p data-i18n="home.fact4"></p></div>
    </div>
  </section>
</main>

</footer>
