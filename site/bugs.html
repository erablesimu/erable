<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erable</title>
<meta name="i18n-title" content="bugs.title">
<meta name="description" content="Known problems reported for Erable.">
<meta name="theme-color" content="#d2501f">
<link rel="icon" href="erable.png">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="./"><img src="erable.png" alt="">Erable</a>
    <nav aria-label="Navigation">
      <a href="./" data-i18n="nav.home">Accueil</a>
      <a href="guides.html" data-i18n="nav.tutorials">Tutoriels</a>
      <a href="changelog.html" data-i18n="nav.changes">Changements</a>
      <a href="bugs.html" aria-current="page" data-i18n="nav.bugs">Bugs</a>
      <a href="report.html" data-i18n="nav.report">Signaler</a>
    </nav>
    <div class="lang" role="group" data-i18n-attr="aria-label:nav.language">
      <button type="button" data-set-lang="fr" lang="fr" title="Français">FR</button>
      <button type="button" data-set-lang="en" lang="en" title="English">EN</button>
      <button type="button" data-set-lang="de" lang="de" title="Deutsch">DE</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1 data-i18n="bugs.h1"></h1>
      <p class="lead" data-i18n="bugs.lead"></p>
      <div class="stats" id="bug-stats"></div>
    </div>
    <div class="bug-tools card">
      <div class="tabs" role="group" id="bug-state">
        <button type="button" data-state="open" aria-pressed="true" data-i18n="bugs.open"></button>
        <button type="button" data-state="closed" aria-pressed="false" data-i18n="bugs.closed"></button>
        <button type="button" data-state="all" aria-pressed="false" data-i18n="bugs.all"></button>
      </div>
      <select id="bug-game" data-i18n-attr="aria-label:bugs.game"></select>
      <select id="bug-kind" data-i18n-attr="aria-label:bugs.kind"></select>
      <input id="bug-search" type="search" data-i18n-attr="placeholder:bugs.search;aria-label:bugs.search">
    </div>
    <div id="bug-list"><div class="skeleton"></div><div class="skeleton"></div></div>
    <p class="meta" id="bug-updated"></p>
    <div class="actions"><a class="btn" href="report.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg><span data-i18n="bugs.report"></span></a></div>
  </div>
</main>
<footer class="site">
  <div class="wrap">
    <a class="brand" href="./"><img src="erable.png" alt="">Erable</a>
    <p data-i18n-html="footer.text"></p>
    <a class="btn secondary small" href="https://github.com/erablesimu/erable"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.9.1 3.2.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg><span data-i18n="footer.source">Code source</span></a>
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="site.js"></script>
<script src="bugs.js"></script>
</body>
</html>
